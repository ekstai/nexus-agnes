appId: com.local.agnes-chat
productName: Nexus Agnes
directories:
  app: pack
  output: release
asar: false
files:
  - '**/*'
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
compression: normal
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexus Agnes
  deleteAppDataOnUninstall: false
  artifactName: NexusAgnes-Setup-${version}.${ext}
